# Fixed project name: keeps the existing "wiki_db" and "wiki_images" volumes
# even if this file is moved to a different directory.
name: wiki

services:
  mediawiki:
    build: .
    image: research-assessment-wiki:1.43
    restart: always
    ports:
      - "80:80"
    volumes:
      - images:/var/www/html/images
      - ./LocalSettings.php:/var/www/html/LocalSettings.php:ro
      - ./LocalSettings.project.php:/var/www/html/LocalSettings.project.php:ro
    depends_on:
      - database

  database:
    image: mariadb:11.4
    restart: always
    environment:
      MARIADB_DATABASE: my_wiki
      MARIADB_USER: wikiuser
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db:/var/lib/mysql

volumes:
  images:
  db:
